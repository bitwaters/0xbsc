services:
  signal-bot:
    build:
      context: .
    image: bsc-meme-signal-bot:local
    restart: unless-stopped
    stop_grace_period: 90s
    read_only: true
    environment:
      # User-approved formal trial. The runtime itself persists its selected facts and results.
      PUBLICATION_ENGINE: ${PUBLICATION_ENGINE:-trial}
      PUBLICATION_MANIFEST_PATH: /app/models/flow-momentum-trial-v1.json
      PUBLICATION_MODEL_HASH: b45519a8de78182301264c117e1ce6db92131eba166d3b5300ccab9bd12bb3eb
      RESEARCH_MODE: ${RESEARCH_MODE:-off}
      RESEARCH_RUN_ID: ${RESEARCH_RUN_ID:-research-observe-v3}
    volumes:
      - type: bind
        source: ./config.yaml
        target: /home/signalbot/.config/gmgn-signal-bot/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.env
        target: /home/signalbot/.config/gmgn-signal-bot/.env
        read_only: true
        bind:
          create_host_path: false
      - signal-bot-data:/var/lib/gmgn-signal-bot
    tmpfs:
      - /tmp:mode=1777

volumes:
  signal-bot-data:
