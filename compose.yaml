services:
  signal-bot:
    build:
      context: .
    image: bsc-meme-signal-bot:local
    restart: unless-stopped
    read_only: true
    volumes:
      - type: bind
        source: ./config.yaml
        target: /home/signalbot/.config/gmgn-signal-bot/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.env
        target: /home/signalbot/.config/gmgn-signal-bot/.env
        read_only: true
        bind:
          create_host_path: false
      - signal-bot-data:/var/lib/gmgn-signal-bot
    tmpfs:
      - /tmp:mode=1777

volumes:
  signal-bot-data:
