# Copy to ~/.config/gmgn-signal-bot/config.yaml and replace all placeholders.
# Strategy settings live here. Optional sibling .env overrides credentials and runtime mode.
runtime:
  chain: bsc
  mode: dry_run
gmgn:
  base_url: https://openapi.gmgn.ai
  api_key: REPLACE_ME
  quote_wallet: '0x0000000000000000000000000000000000000001'
  rate_limit:
    hard_weight_per_second: 20
    soft_weight_per_second: 14
    burst_reserve_weight: 6
    max_in_flight: 4
    quote_min_interval_ms: 600
    quote_completion_gap_ms: 1000 # response-to-next-request spacing; learned Quote backoff is persisted
    missing_reset_delay_seconds: 30
  endpoint_weights:
    trending: 1
    info: 1
    security: 1
    pool: 1
    smart_money: 1
    kol: 1
    gas: 1
    kline: 2
    quote: 2
    created_tokens: 2
    trenches: 3
    hot: 3
    market_signal: 3
    holders: 5
    traders: 5
telegram:
  bot_token: REPLACE_ME
  chat_ids: ['-1000000000000']
  # Administrators for privileged actions only; GMGN links are public. Empty denies all admin actions.
  allowed_user_ids: []
  buttons:
    gmgn_detail: GMGN 详情
polling:
  jitter_percent: 0.1
  high_frequency_signal_seconds: 2
  narrative_signal_seconds: 5
  trenches_seconds: 5
  smart_money_seconds: 2
  kol_seconds: 3
  trending_seconds: 5
  trending_max_rank: 50
  # Rank movement inside the same five-place band does not create a new decision event.
  rank_change_step: 5
  hot_short_seconds: 15
  hot_long_seconds: 60
  gas_seconds: 30
  observation_seconds: 30
  high_frequency_signal_types: [1, 6, 7, 8, 12, 20]
  narrative_signal_types: [2, 3, 4, 5, 9, 11, 13, 19]
security:
  max_buy_tax: 0.05
  max_sell_tax: 0.05
  max_top10_percent: 0.5
  max_team_percent: 0.1
  max_entrapment_percent: 0.2
  max_bundler_percent: 0.2
  max_sniper_percent: 0.2
  min_lp_locked_or_burned_percent: 0.8
  fatal_flags: [honeypot, blacklist, non_open_source]
  # Formal candidates only. Missing or unmappable fields reject the candidate.
  lazy_deep:
    max_single_non_pool_holder_percent: 0.2
    max_suspicious_holder_percent: 0.1
    max_creator_hold_percent: 0.1
    max_creator_created_tokens: 5
    min_creator_open_ratio: 0.5
    # Creator history affects scoring only and can never subtract more than 5 points.
    creator_history_max_penalty_points: 5
    coordinated_exit:
      min_snapshot_interval_seconds: 10
      min_tagged_wallets: 3
      min_each_sell_percent: 0.05
      min_total_sell_percent: 0.2
      max_activity_age_seconds: 180
      max_activity_spread_seconds: 60
      recognized_wallet_tags: [smart_money, smart money, smartmoney, kol]
strategy:
  new_launch_max_age_hours: 24
  new_launch_min_liquidity_usd: 10000
  revival_min_age_hours: 24
  revival_min_liquidity_usd: 20000
  continuation_min_liquidity_usd: 30000
  dormancy_window_candles: 12
  dormancy_max_average_volume_usd: 1000
  dormancy_max_average_swaps: 20
  revival_baseline_candles: 12
  revival_min_absolute_volume_usd: 10000
  revival_min_absolute_swaps: 30
  revival_volume_multiple: 3
  revival_swaps_multiple: 2
  breakout_lookback_candles: 12
  breakout_minimum_rate: 0
  trend_lookback_candles: 12
  trend_minimum_growth_rate: 0.1
  pullback_max_retrace_rate: 0.25
  pullback_max_volume_ratio: 0.8
  restart_minimum_volume_ratio: 1.5
  vertical_pump_window_candles: 3
  vertical_pump_maximum_growth_rate: 0.5
evidence:
  ttl_seconds:
    lifecycle: 600
    structure: 180
    capital: 300
    attention: 600
    narrative: 1800
scoring:
  observation_threshold: 65
  formal_threshold: 80
  min_completeness: 0.7
  data_ttl_seconds: { info: 30, pool: 30, kline: 60, traders: 180, holders: 300, creator: 3600 }
  route_weights:
    new_launch:
      { lifecycle: 20, structure: 25, capital: 25, attention: 15, quality: 10, freshness: 5 }
    revival: { lifecycle: 5, structure: 30, capital: 30, attention: 20, quality: 10, freshness: 5 }
    continuation:
      { lifecycle: 0, structure: 40, capital: 30, attention: 10, quality: 10, freshness: 10 }
  decisive_trigger_seconds: { new_launch: 90, revival: 120, continuation: 60 }
observation:
  max_active_episodes: 60
  soft_route_target: 20
  expiry_minutes: { new_launch: 15, revival: 30, continuation: 15, narrative: 60 }
quote:
  position_usd: [10, 50, 100]
  max_slippage_percent: 0.05
  max_one_way_loss: { '10': 0.02, '50': 0.03, '100': 0.05 }
  max_round_trip_loss: { '10': 0.05, '50': 0.06, '100': 0.08 }
  retry_minimum_seconds: 30
  material_price_change_percent: 0.05
  material_liquidity_change_percent: 0.1
  security_pool_max_age_seconds: 30
  max_age_seconds: 5
# Experimental V2 records decisions only; it does not send additional signals.
optimization:
  enabled: true
  minimum_buy_share: 0.60
  confirmations: 3
  minimum_spacing_seconds: 10
  max_sample_age_seconds: 60
  formal_threshold: 80
  early_age_minutes: 15
  early_observe_only: true
  soft_failure_grace_seconds: 60
  prewatch_hot_capacity: 10
  prewatch_capacity: 20
  prewatch_seconds: 60
  prewatch_expiry_minutes: 15
  queue_capacity: 200
  queue_concurrency: 4
evaluation:
  target_multiples: [1.3, 1.5, 2, 3]
  checkpoints_minutes: [1, 3, 5, 15, 30, 60]
  narrative_checkpoints_minutes: [120, 240]
  unsent_tracking_minutes: 60
  path_max_capture_attempts: 3
  path_retry_seconds: 30
  path_max_gap_requests: 2
  take_profit_percent: 0.3
  stop_loss_percent: 0.1
storage:
  sqlite_path: /var/lib/gmgn-signal-bot/signal-bot.db
  raw_payload_retention_days: 7
logging:
  level: info
  format: json
